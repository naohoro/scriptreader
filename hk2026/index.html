<!DOCTYPE html>
<html lang="ja" data-theme="light" data-fontsize="3">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>香港 商談会/交流会 2026 — MC Script Reader</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <div id="viewer-screen" style="display: flex; flex-direction: column;">

    <!-- Top Bar -->
    <div id="topbar">
      <div id="topbar-mark">HK</div>
      <div id="topbar-event">
        <div id="topbar-event-title">—</div>
        <div id="topbar-part-hint"></div>
      </div>
      <div id="topbar-time-block">
        <div id="topbar-clock">--:--<span class="tz-badge">HKT</span></div>
        <div id="time-status" class="status-before">—</div>
      </div>
    </div>

    <!-- Part Nav -->
    <div id="part-nav">
      <div id="part-tabs"></div>
    </div>

    <!-- Controls Bar -->
    <div id="controls-bar">
      <div class="controls-group" id="mc-filter-group"></div>
      <div class="controls-sep"></div>
      <button class="ctrl-btn" onclick="toggleLang()" id="lang-btn" data-i18n="langSwitch"></button>
      <div class="controls-sep"></div>
      <button class="ctrl-btn" id="theme-btn" onclick="toggleTheme()">
        <span class="theme-icon"></span>
      </button>
      <div class="controls-sep"></div>
      <button class="ctrl-btn" id="edit-btn" onclick="toggleEditMode()">
        <span data-i18n="editBtn"></span>
      </button>
    </div>

    <!-- Edit Warning Banner -->
    <div id="edit-warning" style="display:none;">
      <span class="edit-warning-icon">&#9998;</span>
      <span data-i18n="editWarning"></span>
    </div>

    <!-- Script Content -->
    <div id="script-scroll" role="main"></div>

    <!-- Floating Chapter Navigation (right) -->
    <div id="chapter-nav">
      <button class="chapter-nav-btn" id="chapter-prev" onclick="navPart(-1)" title="前のパート">▲</button>
      <button class="chapter-nav-btn" id="chapter-next" onclick="navPart(+1)" title="次のパート">▼</button>
    </div>

    <!-- Floating Font Size (left) -->
    <div id="font-nav">
      <button class="chapter-nav-btn" onclick="changeFontSize(+1)" title="文字を大きく">＋</button>
      <button class="chapter-nav-btn" onclick="changeFontSize(-1)" title="文字を小さく">－</button>
    </div>

  </div><!-- /#viewer-screen -->

</div><!-- /#app -->

<script src="data/hk2026.js"></script>
<script src="js/app.js"></script>
</body>
</html>
